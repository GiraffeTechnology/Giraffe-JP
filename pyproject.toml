[project]
name = "giraffe-jp"
version = "1.0.0"
description = "Giraffe JP — Merchant-Owned C-B-M Backend Package built on Giraffe Agent / abcdYi"
requires-python = ">=3.11"
dependencies = [
    "gltg",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "bcrypt<4.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires live PostgreSQL migrated database",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.uv.sources]
gltg = { path = "libs/GLTG", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src", "api"]
